[package]
name = "folio"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
[features]
native-smoke = []
[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
ureq = "2"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Native print bridge (layout L1). Every crate here is already locked through wry/tao at the
# same version; only feature flags are added. block2 supplies WebKit completion/decision blocks.
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "block2",
    "objc2-app-kit",
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKPreferences",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebpagePreferences",
    "WKWebsiteDataStore",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSGraphics",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLRequest",
] }

[dev-dependencies]
tempfile = "3"
